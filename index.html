<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทความข่าว | เฝ้ากาก สระแก้ว</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #faf6ee; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="app"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write"
          allowfullscreen></iframe>
  <script>
    // วางลิงก์ /exec ของ Apps Script บทความข่าว
    const EXEC = 'https://script.google.com/macros/s/AKfycbyQzVsEChwHZsHA7hfXOl9w3AYh5rBJ2JBLYCcct3mUXr7RUrcMpNFC5tcmO85o0Ld5/exec';
    // ส่ง ?page=admin ต่อให้ Apps Script ถ้ามี
    const SRC = EXEC + location.search;
    document.getElementById('app').src = SRC;
    // กดย้อนกลับมาแล้วเบราว์เซอร์คืนหน้าเดิมจากแคช → สร้างกรอบใหม่ (ไม่เพิ่มประวัติการย้อนกลับ)
    window.addEventListener('pageshow', e => {
      if (!e.persisted) return;
      const old = document.getElementById('app');
      const fresh = old.cloneNode(false);
      fresh.src = SRC;
      old.replaceWith(fresh);
    });
  </script>
</body>
</html>
