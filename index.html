<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทความข่าว | เฝ้ากาก สระแก้ว</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #faf6ee; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="app"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write"
          allowfullscreen></iframe>
  <script>
    // วางลิงก์ /exec ของ Apps Script บทความข่าว
    const EXEC = 'https://script.google.com/macros/s/ใส่ลิงก์exec/exec';
    // ส่ง ?page=admin ต่อให้ Apps Script ถ้ามี
    const app = document.getElementById('app');
    app.src = EXEC + location.search;
    // กดย้อนกลับมาจากเว็บข่าว แล้วเบราว์เซอร์คืนหน้าเดิมจากแคช → โหลดระบบใหม่ ไม่ให้หน้าค้าง
    window.addEventListener('pageshow', e => { if (e.persisted) app.src = EXEC + location.search; });
  </script>
</body>
</html>
